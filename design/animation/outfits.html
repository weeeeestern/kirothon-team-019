<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"/>
<title>키로 상황별 모습 · 옷장 (소프트)</title>
<link rel="stylesheet" href="kiro-avatar-soft.css"/>
<style>

    
    @font-face { font-family: "Gothic A1"; src: url("../fonts/GothicA1-Regular.ttf") format("truetype"); font-weight: 400; font-display: swap; }
    @font-face { font-family: "Gothic A1"; src: url("../fonts/GothicA1-Medium.ttf") format("truetype"); font-weight: 500; font-display: swap; }
    @font-face { font-family: "Gothic A1"; src: url("../fonts/GothicA1-SemiBold.ttf") format("truetype"); font-weight: 600; font-display: swap; }
    @font-face { font-family: "Gothic A1"; src: url("../fonts/GothicA1-Bold.ttf") format("truetype"); font-weight: 700; font-display: swap; }
    @font-face { font-family: "Gothic A1"; src: url("../fonts/GothicA1-ExtraBold.ttf") format("truetype"); font-weight: 800; font-display: swap; }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      background: #0A0810;
      color: #FAFAFA;
      font-family: "Gothic A1", "Noto Sans CJK KR", sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    h1 { font-size: 40px; font-weight: 800; letter-spacing: -0.05em; }
    .lead { color: #A1A1AA; margin: 8px 0 36px; font-size: 16px; }
    .sec { font-size: 13px; letter-spacing: 0.14em; text-transform: uppercase; color: #C6A0FF; font-weight: 700; margin: 28px 0 14px; }
    .lab { margin-top: 8px; font-size: 14px; font-weight: 700; }
    .sub { font-size: 11px; color: #7A7484; margin-top: 2px; line-height: 1.4; }
    .limtag { display: inline-block; margin-top: 6px; background: #F6D56A; color: #3A2A10; font-size: 10px; font-weight: 800; padding: 2px 6px; border-radius: 6px; }

#sheet { padding: 56px 64px 64px;
  background: radial-gradient(ellipse 900px 500px at 80% 0%, rgba(165,123,255,0.22), transparent 50%), #0A0810; }
#sheet-sit { display: grid; grid-template-columns: repeat(7, 1fr); gap: 12px; }
#sheet-basic, #sheet-lim { display: grid; grid-template-columns: repeat(6, 1fr); gap: 16px 12px; width: 100%; }
.sheet-item { text-align: center; }
</style>
</head>
<body>
<section id="sheet">
  <h1>키로 상황별 모습 · 옷장</h1>
  <p class="lead">공식 실루엣(흰 몸통, 검은 타원 눈)은 그대로 두고, 선과 색만 부드럽게 다듬었습니다. 눈·입·모자·소품은 KiroCrew 어휘와 상황 의상으로 바꿉니다.</p>
  <div class="sec">상황 → 의상</div>
  <div id="sheet-sit"></div>
  <div class="sec">기본 옷장</div>
  <div id="sheet-basic"></div>
  <div class="sec">한정판</div>
  <div id="sheet-lim"></div>
</section>
<script src="kiro-avatar-soft.js"></script>
<script>
const sitMap = {
  ordinary: "sleepy / 입 없음 / 소품 없음 / #A57BFF",
  construction: "squint + flat / hardhat + wrench / #F3C98A",
  rain: "canon / 우비·우산 / #6BA3C9",
  dust: "squint / 마스크 / #C4A574",
  marathon: "sparkle + grin / bandana / #F090A8",
  strike: "wide + raised + oh / 안내판 / #E8928A",
  congestion: "swirl + wobble / #C97A9A",
};
const BASIC = ["base","hardhat","raincoat","mask","bandana","beanie","cap","phones","glasses","mug","crown"];
const LIMITED = ["marathon26","bikehelmet","halo","flower","party"];
const limTile = { marathon26:"#F090A8", bikehelmet:"#6B4DB3", halo:"#7EC8B0", flower:"#D489A8", party:"#A57BFF" };

document.getElementById("sheet-sit").innerHTML = Object.keys(KiroAvatar.SITUATIONS).map(k => {
  const s = KiroAvatar.SITUATIONS[k];
  return `<div class="sheet-item">${KiroAvatar.render({state:k,size:200,motion:"idle"})}
    <div class="lab">${s.label}</div><div class="sub">${sitMap[k]}</div></div>`;
}).join("");
document.getElementById("sheet-basic").innerHTML = BASIC.map(k => {
  const o = KiroAvatar.OUTFITS[k];
  return `<div class="sheet-item">${KiroAvatar.render({outfit:k,state:"ordinary",size:180,tile:"#A57BFF",tileSoft:"#C4A6FF",motion:"idle"})}
    <div class="lab">${o.label}</div></div>`;
}).join("");
document.getElementById("sheet-lim").innerHTML = LIMITED.map(k => {
  const o = KiroAvatar.OUTFITS[k];
  return `<div class="sheet-item">${KiroAvatar.render({outfit:k,state:"ordinary",size:180,tile:limTile[k],motion:"idle"})}
    <div class="lab">${o.label}</div><div class="limtag">LIMITED</div></div>`;
}).join("");
</script>
</body>
</html>
